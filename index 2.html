<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MONO LIFE">
  <meta name="description" content="Личный центр: деньги, планы и платежи">
  <title>MONO / LIFE</title>
  <style>
    :root{
      color-scheme:dark;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;
      --bg:#06090f;--panel:rgba(15,20,29,.76);--panel-solid:#111722;--panel-2:#171f2d;
      --line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.16);--text:#f7fbff;--muted:#8e99aa;
      --blue:#69b7ff;--blue-2:#3b82f6;--good:#7ee2a8;--bad:#ff9eaa;--shadow:0 24px 70px rgba(0,0,0,.36);
      background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased
    }
    *{box-sizing:border-box}
    html{background:var(--bg);scroll-behavior:smooth}
    body{margin:0;min-height:100vh;background:var(--bg);overflow-x:hidden}
    body::before,body::after{content:"";position:fixed;z-index:-2;pointer-events:none;filter:blur(18px);opacity:.72;border-radius:999px}
    body::before{width:75vw;height:55vw;max-width:680px;max-height:500px;left:-25vw;top:-14vw;background:radial-gradient(circle at 45% 45%,rgba(65,150,255,.38),rgba(21,78,155,.09) 50%,transparent 72%);animation:floatOne 12s ease-in-out infinite alternate}
    body::after{width:72vw;height:72vw;max-width:720px;max-height:720px;right:-38vw;top:23vh;background:radial-gradient(circle at 50% 50%,rgba(59,130,246,.28),rgba(16,58,122,.08) 48%,transparent 70%);animation:floatTwo 15s ease-in-out infinite alternate}
    .ambient{position:fixed;inset:0;z-index:-3;pointer-events:none;background:
      radial-gradient(ellipse 100% 45% at 50% -15%,rgba(73,150,255,.15),transparent 67%),
      linear-gradient(180deg,#07101b 0,#06090f 34%,#05080d 100%)}
    @keyframes floatOne{from{transform:translate3d(-2%,0,0) scale(.95)}to{transform:translate3d(18%,14%,0) scale(1.12)}}
    @keyframes floatTwo{from{transform:translate3d(0,-4%,0) scale(1)}to{transform:translate3d(-19%,16%,0) scale(1.18)}}
    @keyframes pageIn{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
    @keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes sheetIn{from{transform:translateY(22px);opacity:.3}to{transform:none;opacity:1}}
    @keyframes shimmer{0%{background-position:0 50%}100%{background-position:100% 50%}}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer;-webkit-tap-highlight-color:transparent}
    button:active{transform:scale(.975)}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid rgba(105,183,255,.95);outline-offset:3px}
    button:disabled{opacity:.42;cursor:not-allowed}
    input,textarea,select{outline:none}
    .shell{max-width:570px;min-height:100vh;margin:auto;padding:0 17px calc(104px + env(safe-area-inset-bottom));position:relative}
    .topbar{height:80px;display:flex;align-items:center;justify-content:space-between;padding-top:env(safe-area-inset-top)}
    .brand{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.18em;font-weight:800;text-transform:uppercase}
    .brand-mark{width:30px;height:30px;border:1px solid rgba(255,255,255,.42);border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(105,183,255,.28),rgba(255,255,255,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 8px 25px rgba(33,118,225,.18);font-size:15px;letter-spacing:0}
    .slash{color:#5a6575}.local-badge{font-size:9px;color:#a8b2c1;letter-spacing:.12em;border:1px solid var(--line);padding:8px 10px;border-radius:999px;background:rgba(14,19,27,.48);backdrop-filter:blur(18px)}
    #app{animation:pageIn .38s cubic-bezier(.2,.8,.2,1)}
    .page-title{font-size:32px;line-height:1.06;letter-spacing:-.055em;margin:18px 0 18px;font-weight:730}
    .date-kicker{color:#8fbcea;text-transform:uppercase;letter-spacing:.13em;font-size:10px;font-weight:800;margin-top:12px}
    .hero-title{font-size:34px;line-height:1.07;letter-spacing:-.055em;margin:8px 0 18px;font-weight:730}
    .muted{color:var(--muted)}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.16em;color:#93a2b8;text-transform:uppercase}
    .glass{background:linear-gradient(145deg,rgba(22,31,45,.82),rgba(10,15,23,.72));border:1px solid var(--line);backdrop-filter:blur(24px);box-shadow:inset 0 1px 0 rgba(255,255,255,.045),var(--shadow)}
    .balance-card{position:relative;overflow:hidden;border-radius:30px;padding:23px;background:
      radial-gradient(circle at 90% -25%,rgba(99,180,255,.34),transparent 36%),
      linear-gradient(145deg,rgba(27,41,61,.96),rgba(13,19,29,.95) 70%);border:1px solid rgba(145,197,255,.18);box-shadow:0 24px 80px rgba(0,0,0,.33),0 0 55px rgba(59,130,246,.08)}
    .balance-card::before{content:"";position:absolute;inset:-60% -30% auto auto;width:260px;height:260px;border-radius:50%;border:1px solid rgba(164,212,255,.13);box-shadow:0 0 0 32px rgba(255,255,255,.018),0 0 0 72px rgba(255,255,255,.01)}
    .balance-amount{font-size:clamp(36px,10vw,50px);line-height:1.05;font-weight:680;letter-spacing:-.06em;margin:16px 0 32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
    .balance-bottom{display:flex;border-top:1px solid rgba(255,255,255,.1);padding-top:17px}.mini-metric{width:50%}.mini-metric+.mini-metric{border-left:1px solid rgba(255,255,255,.1);padding-left:16px}.mini-metric span{display:block;color:#8ea0b9;font-size:10px;letter-spacing:.08em;margin-bottom:7px}.mini-metric strong{font-size:15px;font-weight:670;font-variant-numeric:tabular-nums}
    .quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px}.quick-action{border:1px solid var(--line);background:rgba(16,22,32,.72);color:#dbe9f6;border-radius:17px;min-height:70px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;backdrop-filter:blur(20px);transition:transform .2s,background .2s,border-color .2s}.quick-action:hover{background:rgba(25,34,49,.86);border-color:rgba(105,183,255,.2)}.quick-action .qicon{font-size:20px}.quick-action span:last-child{font-size:10px;color:#aab5c4}
    .section-heading{display:flex;justify-content:space-between;align-items:baseline;margin:28px 2px 12px}.section-heading h2{font-size:18px;margin:0;letter-spacing:-.03em}.section-heading button{border:0;color:#82bfff;background:none;font-size:12px;padding:5px}
    .card{background:rgba(14,19,28,.78);border:1px solid var(--line);border-radius:23px;padding:18px;backdrop-filter:blur(22px);box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}
    .today-card{background:linear-gradient(135deg,rgba(20,30,44,.84),rgba(11,16,24,.84));border-color:rgba(105,183,255,.13)}
    .agenda-row,.payment-row,.entry-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.075);animation:rowIn .28s ease both}.agenda-row:first-child,.payment-row:first-child,.entry-row:first-child{padding-top:1px}.agenda-row:last-child,.payment-row:last-child,.entry-row:last-child{border-bottom:0;padding-bottom:1px}
    .emoji-box,.entry-icon{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.06);display:grid;place-items:center;font-size:20px;flex-shrink:0}.agenda-main,.payment-main,.entry-main{min-width:0;flex:1}.agenda-main strong,.payment-main strong,.entry-main strong{display:block;font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.agenda-main small,.payment-main small,.entry-main small{display:block;color:#8491a4;margin-top:4px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-check{width:24px;height:24px;border-radius:50%;border:1px solid #596779;background:transparent;color:#fff;display:grid;place-items:center;flex-shrink:0}.task-check.done{background:linear-gradient(145deg,#74baff,#327fec);border-color:transparent}.task-done .agenda-main{opacity:.55}.task-done .agenda-main strong{text-decoration:line-through}.entry-value,.payment-amount{font-size:14px;font-weight:720;white-space:nowrap;font-variant-numeric:tabular-nums}.payment-days{font-size:10px;color:#7ebdff;background:rgba(83,164,255,.11);border:1px solid rgba(83,164,255,.14);padding:6px 8px;border-radius:999px;white-space:nowrap}.empty{color:#8491a4;line-height:1.55;font-size:13px;padding:7px 0}.small-note{font-size:11px;color:#7f8b9b;line-height:1.5;margin:12px 0 0}
    .allowance{display:flex;align-items:center;gap:13px}.allowance-icon{width:42px;height:42px;border-radius:14px;background:rgba(85,163,255,.1);border:1px solid rgba(101,177,255,.18);display:grid;place-items:center;font-size:20px}.allowance h3{font-size:11px;color:#8e9caf;margin:0 0 7px;font-weight:560}.allowance strong{font-size:23px;letter-spacing:-.04em}
    .tabbar{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,570px);display:flex;justify-content:space-around;background:rgba(8,12,18,.78);backdrop-filter:blur(28px) saturate(130%);border-top:1px solid rgba(255,255,255,.09);padding:8px 7px calc(8px + env(safe-area-inset-bottom))}.tab{width:25%;border:0;background:transparent;color:#657184;display:flex;align-items:center;flex-direction:column;gap:4px;padding:3px;font-size:9px;transition:color .25s,transform .25s}.tab.active{color:#dff1ff}.tab-icon{font-size:20px;height:23px;line-height:23px;transition:transform .28s}.tab.active .tab-icon{transform:translateY(-1px) scale(1.06);filter:drop-shadow(0 0 10px rgba(105,183,255,.5))}
    .month-switch{display:flex;align-items:center;justify-content:space-between;margin:7px 0 14px;background:rgba(14,20,30,.72);border:1px solid var(--line);border-radius:16px;height:49px;backdrop-filter:blur(18px)}.month-switch button{height:100%;min-width:54px;background:none;color:#cfe8ff;border:0;font-size:22px}.month-switch strong{font-size:13px;text-transform:capitalize}
    .filter-row{display:flex;gap:7px;margin-bottom:14px}.filter-row button{border:1px solid var(--line);border-radius:12px;background:rgba(13,18,27,.72);color:#8e9aab;padding:9px 15px;font-size:12px}.filter-row button.selected{background:rgba(103,181,255,.14);color:#dcedff;border-color:rgba(105,183,255,.25)}.history-group{margin-bottom:16px}.history-group h3{font-size:11px;color:#8490a1;margin:0 0 9px 3px;font-weight:600}.delete-entry,.icon-button{border:0;background:transparent;color:#7f8998;font-size:18px;padding:8px;margin-right:-8px}
    .bar-row{margin-bottom:20px}.bar-row:last-child{margin-bottom:0}.bar-head{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-bottom:9px}.bar-head b{font-weight:680}.track{height:6px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#4d99f7,#81c7ff);background-size:180% 100%;border-radius:8px;animation:shimmer 4s linear infinite alternate}
    .settings-row{width:100%;background:none;border:0;color:#eef5fb;text-align:left;display:flex;justify-content:space-between;padding:16px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,.075)}.settings-row:first-child{padding-top:1px}.settings-row:last-child{padding-bottom:1px;border-bottom:0}.settings-row span:last-child{color:#8c99aa}.category-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.075)}.category-row:last-child{border:0}.category-row .entry-icon{width:34px;height:34px;font-size:17px;border-radius:11px}.category-row span:nth-child(2){flex:1;font-size:13px}.category-row button{background:transparent;color:#768193;border:0;font-size:19px}.secondary-button{padding:12px 14px;border:1px solid var(--line-strong);border-radius:13px;background:rgba(255,255,255,.045);color:#e8f4ff;font-size:12px;font-weight:650}.backup-actions{display:flex;gap:8px}.backup-actions button{flex:1}.info{font-size:12px;color:#8895a6;line-height:1.55}
    .calendar{padding:12px}.cal-weekdays,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal-weekdays{margin-bottom:7px}.cal-weekdays span{text-align:center;font-size:9px;color:#667386;text-transform:uppercase}.cal-day{aspect-ratio:1/1;border:1px solid transparent;background:transparent;color:#d9e3ee;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;font-size:12px}.cal-day.out{color:#394354}.cal-day.today{border-color:rgba(105,183,255,.3);background:rgba(105,183,255,.06)}.cal-day.selected{background:linear-gradient(145deg,#6ab8ff,#397fde);color:#06101d;font-weight:800;box-shadow:0 8px 22px rgba(59,130,246,.25)}.cal-dots{height:4px;display:flex;gap:2px}.cal-dot{width:3px;height:3px;border-radius:50%;background:#77bcff}.cal-day.selected .cal-dot{background:#07111f}.agenda-date{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.agenda-date strong{font-size:14px}.agenda-date span{font-size:11px;color:#788598}
    .sheet{width:min(100%,570px);max-height:96dvh;margin:auto auto 0;border:1px solid rgba(255,255,255,.12);background:rgba(13,18,27,.94);backdrop-filter:blur(32px);color:white;border-radius:28px 28px 0 0;padding:0;box-shadow:0 -24px 90px rgba(0,0,0,.55)}.sheet[open]{animation:sheetIn .3s cubic-bezier(.16,.8,.2,1)}.sheet::backdrop{background:rgba(0,0,0,.58);backdrop-filter:blur(4px)}.sheet-body{padding:11px 21px calc(22px + env(safe-area-inset-bottom));overflow-y:auto;max-height:95dvh}.sheet-handle{width:36px;height:4px;border-radius:5px;background:#526071;margin:0 auto 21px}.sheet-heading{display:flex;align-items:center;justify-content:space-between}.sheet-heading h2{margin:0 0 16px;font-size:20px;letter-spacing:-.03em}.close{border:0;background:none;color:#7f8b9b;font-size:29px;line-height:1}.segmented{display:flex;gap:3px;background:rgba(255,255,255,.07);border-radius:13px;padding:4px}.segment{flex:1;border:0;background:none;color:#8d99aa;padding:10px;border-radius:10px;font-size:13px}.segment.active{background:rgba(216,237,255,.94);color:#0e1621;font-weight:750}.amount-label{display:block;margin:22px 0}.amount-label>span:first-child{display:block;color:#8794a6;font-size:10px;letter-spacing:.15em}.amount-input-wrap{display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.15)}.amount-input-wrap input{min-width:0;width:100%;border:0;background:transparent;color:white;font-size:45px;letter-spacing:-.055em;padding:9px 0}.amount-input-wrap b{font-size:23px;color:#8190a3}.field{display:block;font-size:12px;color:#95a2b3;margin:13px 0}.field small{color:#5f6a79}.field input,.field select,.field textarea{display:block;width:100%;margin-top:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);border-radius:13px;color:#f6fbff;padding:12px 13px;min-height:47px;font-size:16px;color-scheme:dark}.field textarea{resize:none;min-height:72px}.emoji-field{display:grid;grid-template-columns:74px 1fr;gap:9px;align-items:end}.emoji-input{text-align:center;font-size:28px!important;padding:6px!important}.field-help{margin-top:7px;font-size:10px;color:#697689;line-height:1.45}.check-line{display:flex;align-items:center;gap:10px;padding:8px 1px;color:#aeb9c7;font-size:12px}.check-line input{width:18px;height:18px;accent-color:#65b5ff}.form-error{color:#ff9eaa;font-size:12px;min-height:17px}.primary{width:100%;border:0;border-radius:15px;background:linear-gradient(135deg,#8bcaff,#58a8f7 55%,#3d84e4);color:#07111c;font-size:14px;font-weight:800;padding:15px;margin-top:6px;box-shadow:0 10px 30px rgba(57,132,226,.22)}
    .quick-menu{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px}.quick-menu button{min-height:92px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.045);color:#eaf5ff;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;padding:14px;text-align:left}.quick-menu .big{font-size:25px;margin-bottom:auto}.quick-menu small{color:#758294;margin-top:4px;font-size:10px}
    .login-cover{position:fixed;inset:0;z-index:100;background:
      radial-gradient(circle at 20% 0%,rgba(65,150,255,.25),transparent 42%),
      radial-gradient(circle at 100% 60%,rgba(59,130,246,.17),transparent 45%),#070a0f;display:flex;justify-content:center;align-items:center;padding:24px}.login-cover[hidden]{display:none}.login-box{width:min(100%,400px);padding:27px;border:1px solid rgba(255,255,255,.1);border-radius:27px;background:rgba(15,20,29,.82);backdrop-filter:blur(30px);box-shadow:0 28px 90px rgba(0,0,0,.5)}.login-box h1{font-size:38px;letter-spacing:-.058em;line-height:1.12;margin:54px 0 14px}.login-box p{font-size:14px;color:#929fb0;line-height:1.6}.login-box button{margin-top:22px}.login-error{font-size:12px!important;color:#ff9eaa!important;min-height:16px;margin-bottom:0!important}
    .toast{position:fixed;z-index:150;top:calc(17px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(238,247,255,.96);color:#0c1520;padding:11px 15px;border-radius:13px;box-shadow:0 14px 38px rgba(0,0,0,.38);max-width:90vw;font-size:12px;text-align:center;backdrop-filter:blur(20px)}.toast.error{background:#552931;color:#fff}
    .danger{color:#ff9eaa}.hidden{display:none!important}
    @media(min-width:700px){.shell{border-left:1px solid rgba(255,255,255,.055);border-right:1px solid rgba(255,255,255,.055)}.topbar{height:92px}.hero-title{font-size:38px}}
    @media(max-width:365px){.shell{padding-left:13px;padding-right:13px}.balance-card{padding:20px}.quick-action span:last-child{font-size:9px}.local-badge{display:none}.cal-grid,.cal-weekdays{gap:2px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="ambient"></div>
  <div id="login" class="login-cover">
    <div class="login-box">
      <div class="brand"><span class="brand-mark">M</span><span>MONO<span class="slash"> / </span>LIFE</span></div>
      <h1>Вся жизнь.<br>В одном месте.</h1>
      <p>Деньги, планы, календарь и предстоящие платежи — только в твоём личном аккаунте.</p>
      <form id="login-form">
        <label class="field">Почта<input name="email" type="email" autocomplete="username" required></label>
        <label class="field">Пароль<input name="password" type="password" autocomplete="current-password" required></label>
        <button id="password-login" class="primary" type="submit">Войти</button>
      </form>
      <p class="login-error" id="login-error" role="alert"></p>
    </div>
  </div>

  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">M</span><span>MONO<span class="slash"> / </span>LIFE</span></div>
      <span class="local-badge">ЛИЧНЫЙ ЦЕНТР</span>
    </header>
    <main id="app" aria-live="polite"></main>
    <nav class="tabbar" aria-label="Разделы">
      <button data-tab="home" class="tab active"><span class="tab-icon">⌂</span><span>Главная</span></button>
      <button data-tab="money" class="tab"><span class="tab-icon">₽</span><span>Деньги</span></button>
      <button data-tab="calendar" class="tab"><span class="tab-icon">◫</span><span>Календарь</span></button>
      <button data-tab="more" class="tab"><span class="tab-icon">•••</span><span>Ещё</span></button>
    </nav>
  </div>

  <dialog id="entry-dialog" class="sheet"><form id="entry-form" class="sheet-body">
    <div class="sheet-handle"></div><div class="sheet-heading"><h2>Новая операция</h2><button type="button" data-close="entry-dialog" class="close">×</button></div>
    <div class="segmented"><button type="button" class="segment active" data-kind="expense">Расход</button><button type="button" class="segment" data-kind="income">Доход</button></div>
    <label class="amount-label"><span>СУММА</span><span class="amount-input-wrap"><input id="entry-amount" name="amount" inputmode="decimal" type="text" placeholder="0" required autocomplete="off"><b>₽</b></span></label>
    <label class="field">Категория<select name="category" id="entry-category" required></select></label>
    <label class="field">Дата<input name="date" type="date" required></label>
    <label class="field">Заметка <small>необязательно</small><input name="note" type="text" maxlength="100" placeholder="Например, продукты на неделю"></label>
    <p class="form-error" id="entry-error"></p><button type="submit" class="primary">Сохранить операцию</button>
  </form></dialog>

  <dialog id="category-dialog" class="sheet"><form id="category-form" class="sheet-body">
    <div class="sheet-handle"></div><div class="sheet-heading"><h2>Новая категория</h2><button type="button" data-close="category-dialog" class="close">×</button></div>
    <label class="field">Название<input name="name" type="text" maxlength="32" placeholder="Например, путешествия" required></label>
    <label class="field">Тип<select name="kind"><option value="expense">Расход</option><option value="income">Доход</option></select></label>

    const pad=n=>String(n).padStart(2,'0');

    const number=(raw,allowNegative=false)=>{const input=String(raw).trim().replaceAll(' ','').replace(',','.');const re=allowNegative?/^-?\d{1,12}(?:\.\d{1,2})?$/:/^\d{1,12}(?:\.\d{1,2})?$/;if(!re.test(input))return null;const neg=input.startsWith('-');const [rub,kop='']=input.replace('-','').split('.');const value=Number(rub)*100+Number(kop.padEnd(2,'0'));return Number.isSafeInteger(value)?value*(neg?-1:1):null;};

    }

      return `<h1 class="page-title">Ещё</h1>
        <div class="section-heading"><h2>Предстоящие платежи</h2><button data-action="add-payment">+ Добавить</button></div><section class="card">${payments.length?payments.map(p=>paymentRow(p,true)).join(''):'<div class="empty">Платежей пока нет.</div>'}</section>
        <div class="section-heading"><h2>Мои деньги</h2></div><section class="card"><button class="settings-row" data-edit="opening"><span>Начальный баланс</span><span>${money(state.opening)} ›</span></button><button class="settings-row" data-edit="reserve"><span>Неснижаемый резерв</span><span>${money(state.reserve)} ›</span></button></section>
        <div class="section-heading"><h2>Категории</h2><button data-action="category">+ Добавить</button></div><section class="card"><div class="eyebrow">Расходы</div>${cats('expense')}</section><section class="card" style="margin-top:9px"><div class="eyebrow">Доходы</div>${cats('income')}</section>
        <div class="section-heading"><h2>Данные</h2></div><section class="card"><div class="backup-actions"><button class="secondary-button" data-action="export">Скачать копию</button><button class="secondary-button" data-action="import">Загрузить копию</button></div><p class="info">Операции, планы, категории и платежи сохраняются в твоём аккаунте Supabase.</p></section>
        <div class="section-heading"><h2>Аккаунт</h2></div><section class="card"><div class="info">${safe(account?.email||'')}</div><button class="settings-row" data-action="logout"><span class="danger">Выйти</span><span>›</span></button></section>`;
    }
    function render(){const views={home,money:moneyView,calendar:calendarView,more:moreView};const app=$('#app');app.style.animation='none';app.innerHTML=views[tab]();void app.offsetWidth;app.style.animation='pageIn .38s cubic-bezier(.2,.8,.2,1)';$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));}
    function fillCategories(){const items=state.categories.filter(c=>c.kind===entryKind);$('#entry-category').innerHTML=items.map(c=>`<option value="${safe(c.id)}">${safe(c.icon)}  ${safe(c.name)}</option>`).join('');$('#entry-form .primary').disabled=!items.length;}
    function openEntry(kind='expense'){entryKind=kind;$('#entry-form').reset();$('#entry-form [name=date]').value=today();$('#entry-error').textContent='';$$('#entry-dialog .segment').forEach(b=>b.classList.toggle('active',b.dataset.kind===kind));fillCategories();$('#entry-dialog').showModal();setTimeout(()=>$('#entry-amount').focus(),180);}
    function openTask(date=today()){$('#task-form').reset();$('#task-form [name=date]').value=date;$('#task-form [name=emoji]').value='📌';$('#task-dialog').showModal();}
    function openPayment(){$('#payment-form').reset();$('#payment-form [name=date]').value=today();$('#payment-form [name=emoji]').value='💳';$('#payment-dialog').showModal();}
    function shiftMonth(amount){const [y,m]=month.split('-').map(Number),d=new Date(y,m-1+amount,1);month=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;if(tab==='calendar'){const sd=toDate(selectedDate);selectedDate=dateString(new Date(d.getFullYear(),d.getMonth(),Math.min(sd.getDate(),new Date(d.getFullYear(),d.getMonth()+1,0).getDate())));}render();}
    function handleQuick(type){$('#quick-dialog')?.close();if(type==='expense'||type==='income')openEntry(type);if(type==='task')openTask(tab==='calendar'?selectedDate:today());if(type==='payment')openPayment();}
    document.addEventListener('click',async event=>{
      const b=event.target.closest('button');if(!b)return;
      if(b.dataset.tab){tab=b.dataset.tab;if(tab==='calendar'&&!selectedDate.startsWith(month))selectedDate=month+'-01';render();window.scrollTo({top:0,behavior:'smooth'});return;}
      if(b.dataset.quick){handleQuick(b.dataset.quick);return;}
      if(b.dataset.close){$('#'+b.dataset.close).close();return;}
      if(b.dataset.kind){entryKind=b.dataset.kind;$$('#entry-dialog .segment').forEach(item=>item.classList.toggle('active',item===b));fillCategories();return;}
      if(b.dataset.month){shiftMonth(Number(b.dataset.month));return;}
      if(b.dataset.filter){filter=b.dataset.filter;render();return;}
      if(b.dataset.date){selectedDate=b.dataset.date;const d=toDate(selectedDate);month=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;render();return;}
      if(b.dataset.action==='add-task'){openTask(today());return;}
      if(b.dataset.action==='add-task-date'){openTask(selectedDate);return;}
      if(b.dataset.action==='add-payment'){openPayment();return;}
      if(b.dataset.action==='all-payments'){tab='more';render();return;}
      if(b.dataset.action==='category'){$('#category-form').reset();$('#category-form [name=icon]').value='✨';$('#category-dialog').showModal();return;}
      if(b.dataset.toggleTask){const t=state.tasks.find(x=>x.id===b.dataset.toggleTask);if(t)await save({...state,tasks:state.tasks.map(x=>x.id===t.id?{...x,done:!x.done}:x)});return;}
      if(b.dataset.payPayment){const p=state.payments.find(x=>x.id===b.dataset.payPayment),occ=b.dataset.payDate;if(p&&occ){await save({...state,payments:state.payments.map(x=>x.id===p.id?{...x,paidDates:[...new Set([...(x.paidDates||[]),occ])]}:x)});toast('Платёж отмечен как оплаченный');}return;}
      if(b.dataset.deleteEntry){const e=state.entries.find(x=>x.id===b.dataset.deleteEntry);if(e&&confirm(`Удалить операцию «${category(e.category).name}» на ${money(e.amount)}?`))await save({...state,entries:state.entries.filter(x=>x.id!==e.id)});return;}
      if(b.dataset.deleteTask){const t=state.tasks.find(x=>x.id===b.dataset.deleteTask);if(t&&confirm(`Удалить план «${t.title}»?`))await save({...state,tasks:state.tasks.filter(x=>x.id!==t.id)});return;}
      if(b.dataset.deletePayment){const p=state.payments.find(x=>x.id===b.dataset.deletePayment);if(p&&confirm(`Удалить платёж «${p.title}»?`))await save({...state,payments:state.payments.filter(x=>x.id!==p.id)});return;}
      if(b.dataset.removeCategory){const c=state.categories.find(x=>x.id===b.dataset.removeCategory);if(c&&!state.entries.some(e=>e.category===c.id)&&confirm(`Удалить категорию «${c.name}»?`))await save({...state,categories:state.categories.filter(x=>x.id!==c.id)});return;}
      if(b.dataset.edit){const field=b.dataset.edit,old=state[field],answer=prompt(field==='opening'?'Начальный баланс в рублях (может быть отрицательным):':'Неснижаемый резерв в рублях:',String(old/100).replace('.',','));if(answer===null)return;const amount=number(answer,field==='opening');if(amount===null||(field==='reserve'&&amount<0)){toast('Введите корректную сумму.',true);return;}await save({...state,[field]:amount});return;}
      if(b.dataset.action==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`mono-life-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);return;}
      if(b.dataset.action==='import'){$('#import-file').click();return;}
      if(b.dataset.action==='logout'){await window.budgetCloud.logout();account=null;state=defaults();$('#login').hidden=false;return;}
    });
    $('#entry-form').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target),amount=number(f.get('amount'));if(amount===null||amount<=0){$('#entry-error').textContent='Введи сумму больше нуля.';return;}const date=String(f.get('date')),cat=String(f.get('category'));if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!state.categories.some(c=>c.id===cat&&c.kind===entryKind)){toast('Проверь дату и категорию.',true);return;}const entry={id:crypto.randomUUID(),amount,kind:entryKind,category:cat,date,note:String(f.get('note')||'').trim()};if(await save({...state,entries:[...state.entries,entry]})){$('#entry-dialog').close();toast('Операция сохранена');}});
    $('#category-form').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')||'').trim(),icon=String(f.get('icon')||'').trim();if(!name||!icon)return;const item={id:crypto.randomUUID(),name,kind:String(f.get('kind')),icon};if(await save({...state,categories:[...state.categories,item]})){$('#category-dialog').close();toast('Категория добавлена');}});
    $('#task-form').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target),title=String(f.get('title')||'').trim(),date=String(f.get('date'));if(!title||!/^\d{4}-\d{2}-\d{2}$/.test(date))return;const task={id:crypto.randomUUID(),title,date,time:String(f.get('time')||''),note:String(f.get('note')||'').trim(),emoji:String(f.get('emoji')||'📌').trim()||'📌',done:false};if(await save({...state,tasks:[...state.tasks,task]})){$('#task-dialog').close();selectedDate=date;toast('План добавлен');}});
    $('#payment-form').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target),title=String(f.get('title')||'').trim(),amount=number(f.get('amount')),date=String(f.get('date'));if(!title||amount===null||amount<=0||!/^\d{4}-\d{2}-\d{2}$/.test(date)){toast('Проверь название, сумму и дату.',true);return;}const payment={id:crypto.randomUUID(),title,amount,date,emoji:String(f.get('emoji')||'💳').trim()||'💳',recurring:f.get('recurring')?'monthly':'none',paidDates:[]};if(await save({...state,payments:[...state.payments,payment]})){$('#payment-dialog').close();toast('Платёж сохранён');}});
    $('#import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{const imported=JSON.parse(await file.text());if(!valid(imported))throw Error('invalid');if(!confirm('Заменить текущие данные данными из копии?'))return;if(await save(normalize(imported)))toast('Копия восстановлена');}catch{toast('Не удалось прочитать файл MONO / LIFE.',true);}});
    $$('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close();}));
    $('#login-form').addEventListener('submit',async e=>{e.preventDefault();const btn=$('#password-login'),f=new FormData(e.currentTarget);btn.disabled=true;$('#login-error').textContent='';try{await window.budgetCloud.login(String(f.get('email')).trim(),String(f.get('password')));account=await window.budgetCloud.session();if(!account)throw Error('Не удалось открыть сеанс.');const loaded=await window.budgetCloud.load(account.id);if(loaded&&!valid(loaded))throw Error('Данные имеют неизвестный формат. Ничего не изменено.');state=normalize(loaded);render();$('#login').hidden=true;e.currentTarget.querySelector('[name=password]').value='';}catch(error){$('#login-error').textContent=error.message||'Не удалось войти.';account=null;}finally{btn.disabled=false;}});
    (async()=>{if(!window.budgetCloud?.ready){$('#password-login').disabled=true;$('#login-error').textContent='Вход ещё не настроен.';return;}try{account=await window.budgetCloud.session();if(!account)return;const loaded=await window.budgetCloud.load(account.id);if(loaded&&!valid(loaded))throw Error('Данные имеют неизвестный формат. Ничего не изменено.');state=normalize(loaded);render();$('#login').hidden=true;}catch(error){$('#login-error').textContent=error.message||'Не удалось загрузить данные.';account=null;}})();
  })();
  </script>
</body>

<body>
  <div id="login" class="login-cover">
    <div class="login-box">
      <div class="brand"><span class="brand-mark">◌</span><span>MONO<span class="slash"> / </span>MONEY</span></div>
      <h1>Твои деньги.<br>Твой доступ.</h1>

        <label class="field">Почта<input name="email" type="email" autocomplete="username" required></label>

        <button id="password-login" class="primary" type="submit">Войти</button>

  </div>
  <div class="shell">
    <header class="topbar"><div class="brand"><span class="brand-mark">◌</span><span>MONO<span class="slash"> / </span>MONEY</span></div><span class="local-badge">ЛИЧНЫЙ УЧЁТ</span></header>
    <main id="app" aria-live="polite"></main>
    <nav class="tabbar" aria-label="Разделы">
      <button data-tab="home" class="tab active"><span class="tab-icon">◫</span><span>Главная</span></button>

      <div class="segmented"><button type="button" class="segment active" data-kind="expense">Расход</button><button type="button" class="segment" data-kind="income">Доход</button></div>
      <label class="amount-label"><span>СУММА</span><span class="amount-input-wrap"><input id="entry-amount" name="amount" inputmode="decimal" type="text" placeholder="0" required autocomplete="off"><b>₽</b></span></label>
      <label class="field">Категория<select name="category" id="entry-category" required></select></label>
      <label class="field">Дата<input name="date" type="date" required></label>

      <div class="sheet-handle"></div>
      <div class="sheet-heading"><h2>Новая категория</h2><button type="button" data-close="category-dialog" class="close" aria-label="Закрыть">×</button></div>

      <button type="submit" class="primary">Добавить категорию</button>

  <script>
(() => {
  'use strict';
  const config = window.MONO_CONFIG || {};
  const ready = Boolean(window.supabase && /^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(config.supabaseUrl) &&
    config.supabasePublishableKey && !config.supabasePublishableKey.startsWith('REPLACE_'));
  const client = ready ? window.supabase.createClient(config.supabaseUrl, config.supabasePublishableKey, {
    auth: { flowType: 'pkce', autoRefreshToken: true, persistSession: true, detectSessionInUrl: true }
  }) : null;

  window.budgetCloud = {
    ready,
    async login(email, password) {
      if (!client) throw new Error('Вход ещё не подключён.');
      const {error} = await client.auth.signInWithPassword({email, password});
      if (error) throw error;
    },
    async session() {
      if (!client) throw new Error('Подключение ещё не настроено.');
      const current = await client.auth.getSession();
      if (current.error) throw current.error;
      if (!current.data.session) return null;
      const {data,error} = await client.auth.getUser();
      if (error) throw error;
      if (data.user) {
        const allowed = await client.rpc('is_budget_owner');
        if (allowed.error) throw allowed.error;
        if (allowed.data !== true) throw new Error('Этот Google-аккаунт не разрешён для личного бюджета.');
      }
      return data.user;
    },
    async load(userId) {
      const {data,error} = await client.from('budget_data').select('payload').eq('user_id',userId).maybeSingle();
      if (error) throw error;
      return data?.payload ?? null;
    },
    async save(userId,payload) {
      const {error} = await client.from('budget_data').upsert({user_id:userId,payload,updated_at:new Date().toISOString()}, {onConflict:'user_id'});
      if (error) throw error;
    },
    async logout() { if (client) { const {error}=await client.auth.signOut();if(error)throw error; } }
  };
})();

  </script>
  <script>
(() => {
  'use strict';
  const $ = (selector) => document.querySelector(selector);
  const safe = (value) => String(value ?? '').replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[char]);
  const defaults = () => ({ version: 1, opening: 0, reserve: 0, entries: [], categories: [
    {id:'food',name:'Продукты',icon:'▣',kind:'expense'}, {id:'cafe',name:'Кафе',icon:'☕',kind:'expense'},
    {id:'transport',name:'Транспорт',icon:'⌁',kind:'expense'}, {id:'scooters',name:'Самокаты',icon:'◌',kind:'expense'},
    {id:'rent',name:'Квартира',icon:'⌂',kind:'expense'}, {id:'utilities',name:'Коммуналка',icon:'⚡',kind:'expense'},
    {id:'internet',name:'Интернет',icon:'◎',kind:'expense'}, {id:'subs',name:'Подписки',icon:'▤',kind:'expense'},
    {id:'fun',name:'Развлечения',icon:'✦',kind:'expense'}, {id:'health',name:'Здоровье',icon:'✚',kind:'expense'},
    {id:'clothes',name:'Одежда',icon:'◇',kind:'expense'}, {id:'other-expense',name:'Другое',icon:'◈',kind:'expense'},
    {id:'salary',name:'Зарплата',icon:'▦',kind:'income'}, {id:'bonus',name:'Премия',icon:'✦',kind:'income'},
    {id:'transfer',name:'Перевод',icon:'↙',kind:'income'}, {id:'other-income',name:'Другое',icon:'◈',kind:'income'}
  ]});
  function valid(data) {
    return data && data.version === 1 && Number.isSafeInteger(data.opening) && Number.isSafeInteger(data.reserve) && data.reserve >= 0 &&
      Array.isArray(data.entries) && data.entries.length < 100000 && Array.isArray(data.categories) && data.categories.length < 1000 &&
      data.entries.every(e => typeof e.id === 'string' && Number.isSafeInteger(e.amount) && e.amount > 0 && ['expense','income'].includes(e.kind) && typeof e.category === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && typeof e.note === 'string') &&
      data.categories.every(c => typeof c.id === 'string' && typeof c.name === 'string' && typeof c.icon === 'string' && ['expense','income'].includes(c.kind));
  }
  let state = defaults(), account = null, saving = false;
  let tab = 'home', month = new Date().getFullYear() + '-' + String(new Date().getMonth() + 1).padStart(2,'0'), filter = 'all', entryKind = 'expense';
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const money = (kopeks) => (kopeks/100).toLocaleString('ru-RU', {maximumFractionDigits: 2}) + ' ₽';
  const number = (raw, allowNegative = false) => {
    const input = String(raw).trim().replaceAll(' ', '').replace(',', '.');
    const regex = allowNegative ? /^-?\d{1,12}(?:\.\d{1,2})?$/ : /^\d{1,12}(?:\.\d{1,2})?$/;
    if (!regex.test(input)) return null;
    const negative = input.startsWith('-'); const [rubles, kopeks = ''] = input.replace('-', '').split('.');
    const amount = Number(rubles) * 100 + Number(kopeks.padEnd(2,'0'));
    return Number.isSafeInteger(amount) ? amount * (negative ? -1 : 1) : null;
  };
  const total = (kind, selectedMonth = month) => state.entries.filter(e => e.kind === kind && e.date.startsWith(selectedMonth)).reduce((a,e) => a + e.amount, 0);
  const balance = () => state.opening + state.entries.reduce((a,e) => a + (e.kind === 'income' ? e.amount : -e.amount),0);
  const monthName = (selected = month) => { const [y,m] = selected.split('-').map(Number); return new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'}).format(new Date(y,m-1,1)); };
  const category = (id) => state.categories.find(c => c.id === id) || { name:'Удалённая категория',icon:'◈' };
  const prettyDate = (str) => new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'}).format(new Date(str+'T12:00:00'));
  const nextPayday = () => { const now=new Date(); const start=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    for(let i=0;i<3;i++) for(const day of [10,25]) { const d=new Date(start.getFullYear(),start.getMonth()+i,day); if(d>start)return {date:d,days:Math.max(1,Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(start.getFullYear(),start.getMonth(),start.getDate()))/86400000))}; }
    return {date:new Date(start.getFullYear(),start.getMonth()+1,10),days:15};
  };
  const allowance = () => Math.floor(Math.max(0,balance()-state.reserve)/nextPayday().days);
  function toast(message,error=false){ document.querySelector('.toast')?.remove(); const el=document.createElement('div');el.className='toast'+(error?' error':'');el.textContent=message;document.body.append(el);setTimeout(()=>el.remove(),3500); }
  async function save(next){
    if (!account || saving) return false;
    saving = true;
    try { await window.budgetCloud.save(account.id,next); state=next;render();return true; }
    catch { toast('Не удалось сохранить. Проверь подключение и повтори действие.',true);return false; }
    finally { saving=false; }
  }
  function row(entry, deletable=false){ const cat=category(entry.category);return `<div class="entry-row"><span class="entry-icon">${safe(cat.icon)}</span><span class="entry-main"><strong>${safe(cat.name)}</strong><small>${safe(entry.note || prettyDate(entry.date))}</small></span><span class="entry-value">${entry.kind === 'expense'?'−':'+'}${money(entry.amount)}</span>${deletable?`<button class="delete-entry" data-delete="${safe(entry.id)}" aria-label="Удалить операцию">×</button>`:''}</div>`; }
  function home(){ const recent=[...state.entries].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5); const pay=nextPayday();return `
    <h1 class="page-title">Главная</h1><section class="balance-card"><div class="eyebrow">ТЕКУЩИЙ БАЛАНС</div><div class="balance-amount">${money(balance())}</div>
      <div class="balance-bottom"><div class="mini-metric"><span>↙ ДОХОДЫ / МЕС</span><strong>${money(total('income',today().slice(0,7)))}</strong></div><div class="mini-metric"><span>↗ РАСХОДЫ / МЕС</span><strong>${money(total('expense',today().slice(0,7)))}</strong></div></div></section>
    <button class="action" data-action="add"><span class="plus-small">+</span> Добавить операцию</button>
    <div class="section-heading"><h2>План до выплаты</h2></div><section class="card"><div class="allowance"><div class="allowance-icon">◎</div><div><h3>Ориентир на день</h3><strong>${money(allowance())}</strong></div></div>
    <p class="small-note">${balance()<=state.reserve?'Баланс не превышает резерв. Свободных денег пока нет.':`После резерва на ${pay.days} дн. до ${prettyDate(todayFrom(pay.date))}. Это ориентир без учёта будущих обязательных платежей.`}</p></section>
    <div class="section-heading"><h2>Последние операции</h2><button data-action="history">Все →</button></div><section class="card entry-list">${recent.length?recent.map(e=>row(e)).join(''):'<div class="empty">Здесь появятся твои доходы и расходы.<br>Добавь первую операцию.</div>'}</section>`; }
  function todayFrom(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
  function history(){ const entries=[...state.entries].filter(e=>e.date.startsWith(month)&&(filter==='all'||filter===e.kind)).sort((a,b)=>b.date.localeCompare(a.date));const groups={};for(const e of entries)(groups[e.date]??=[]).push(e);return `<h1 class="page-title">Операции</h1><div class="month-switch"><button data-month="-1" aria-label="Предыдущий месяц">‹</button><strong>${safe(monthName())}</strong><button data-month="1" aria-label="Следующий месяц">›</button></div>
    <div class="filter-row">${[['all','Все'],['expense','Расходы'],['income','Доходы']].map(([id,label])=>`<button class="${filter===id?'selected':''}" data-filter="${id}">${label}</button>`).join('')}</div>
    ${entries.length?Object.entries(groups).map(([date,items])=>`<section class="history-group"><h3>${safe(prettyDate(date))}</h3><div class="card entry-list">${items.map(e=>row(e,true)).join('')}</div></section>`).join(''):'<section class="card empty">За выбранный месяц операций нет.</section>'}`; }
  function analytics(){ const expenses=state.categories.filter(c=>c.kind==='expense').map(c=>({...c,sum:state.entries.filter(e=>e.kind==='expense'&&e.category===c.id&&e.date.startsWith(month)).reduce((a,e)=>a+e.amount,0)})).filter(c=>c.sum>0).sort((a,b)=>b.sum-a.sum);const top=expenses[0]?.sum||1;return `<h1 class="page-title">Аналитика</h1><div class="month-switch"><button data-month="-1" aria-label="Предыдущий месяц">‹</button><strong>${safe(monthName())}</strong><button data-month="1" aria-label="Следующий месяц">›</button></div>
    <section class="balance-card"><div class="eyebrow">РАСХОДЫ ЗА МЕСЯЦ</div><div class="balance-amount">${money(total('expense'))}</div><div class="balance-bottom"><div class="mini-metric"><span>ДОХОДЫ</span><strong>${money(total('income'))}</strong></div><div class="mini-metric"><span>РАЗНИЦА</span><strong>${money(total('income')-total('expense'))}</strong></div></div></section>
    <div class="section-heading"><h2>По категориям</h2></div><section class="card">${expenses.length?expenses.map(c=>`<div class="bar-row"><div class="bar-head"><span>${safe(c.icon)} &nbsp;${safe(c.name)}</span><b>${money(c.sum)}</b></div><div class="track"><div class="fill" style="width:${Math.max(3,Math.round(c.sum/top*100))}%"></div></div></div>`).join(''):'<div class="empty">За этот месяц расходов пока нет.</div>'}</section>`; }
  function settings(){ const cat=(kind)=>state.categories.filter(c=>c.kind===kind).map(c=>`<div class="category-row"><span class="entry-icon">${safe(c.icon)}</span><span>${safe(c.name)}</span>${state.entries.some(e=>e.category===c.id)?'':`<button data-remove-category="${safe(c.id)}" aria-label="Удалить категорию ${safe(c.name)}">×</button>`}</div>`).join('');return `<h1 class="page-title">Настройки</h1>
    <div class="section-heading"><h2>Мои деньги</h2></div><section class="card"><button class="settings-row" data-edit="opening"><span>Начальный баланс</span><span>${money(state.opening)} ›</span></button><button class="settings-row" data-edit="reserve"><span>Неснижаемый резерв</span><span>${money(state.reserve)} ›</span></button></section>
    <p class="small-note">Начальный баланс — сумма до первой записанной операции. Не добавляй её повторно как доход. Резерв влияет только на дневной ориентир.</p>
    <div class="section-heading"><h2>Категории</h2><button data-action="category">+ Добавить</button></div><section class="card"><div class="eyebrow">РАСХОДЫ</div>${cat('expense')}</section><section class="card" style="margin-top:10px"><div class="eyebrow">ДОХОДЫ</div>${cat('income')}</section>
    <div class="section-heading"><h2>Резервная копия</h2></div><section class="card"><div class="backup-actions"><button class="secondary-button" data-action="export">Скачать данные</button><button class="secondary-button" data-action="import">Загрузить копию</button></div><p class="info">Записи хранятся в твоём личном аккаунте. Копию можно сохранить в «Файлы».</p></section><div class="section-heading"><h2>Аккаунт</h2></div><section class="card"><div class="info">${safe(account?.email||'')}</div><button class="settings-row" data-action="logout"><span>Выйти из аккаунта</span><span>›</span></button></section>`; }
  function render(){ $('#app').innerHTML=({home,history,analytics,settings}[tab])();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab)); }
  function fillCategories(){ const items=state.categories.filter(c=>c.kind===entryKind); $('#entry-category').innerHTML=items.map(c=>`<option value="${safe(c.id)}">${safe(c.icon)}  ${safe(c.name)}</option>`).join(''); $('#entry-form .primary').disabled=!items.length; }
  function openEntry(){entryKind='expense';$('#entry-form').reset();$('#entry-form [name=date]').value=today();$('#entry-error').textContent='';document.querySelectorAll('.segment').forEach(b=>b.classList.toggle('active',b.dataset.kind==='expense'));fillCategories();$('#entry-dialog').showModal();setTimeout(()=>$('#entry-amount').focus(),200);}
  function shiftMonth(amount){ const [y,m]=month.split('-').map(Number);const d=new Date(y,m-1+amount,1);month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render(); }
  document.addEventListener('click',async event=>{
    const b=event.target.closest('button');if(!b)return;
    if(b.dataset.tab){tab=b.dataset.tab;render();window.scrollTo(0,0);}
    if(b.dataset.action==='add')openEntry();
    if(b.dataset.action==='history'){tab='history';render();}
    if(b.dataset.action==='category'){$('#category-form').reset();$('#category-dialog').showModal();}
    if(b.dataset.close)$('#'+b.dataset.close).close();
    if(b.dataset.kind){entryKind=b.dataset.kind;document.querySelectorAll('.segment').forEach(item=>item.classList.toggle('active',item===b));fillCategories();}
    if(b.dataset.month)shiftMonth(Number(b.dataset.month));
    if(b.dataset.filter){filter=b.dataset.filter;render();}
    if(b.dataset.delete){const e=state.entries.find(e=>e.id===b.dataset.delete);if(e&&confirm(`Удалить операцию «${category(e.category).name}» на ${money(e.amount)}?`))await save({...state,entries:state.entries.filter(item=>item.id!==e.id)});}
    if(b.dataset.removeCategory){const c=state.categories.find(c=>c.id===b.dataset.removeCategory);if(c&&!state.entries.some(e=>e.category===c.id)&&confirm(`Удалить категорию «${c.name}»?`))await save({...state,categories:state.categories.filter(item=>item.id!==c.id)});}
    if(b.dataset.edit){const field=b.dataset.edit;const old=state[field];const answer=prompt(field==='opening'?'Начальный баланс в рублях (может быть отрицательным):':'Неснижаемый резерв в рублях:',String(old/100).replace('.',','));if(answer===null)return;const amount=number(answer,field==='opening');if(amount===null||(field==='reserve'&&amount<0)){toast('Введите сумму в рублях, например 10500,50',true);return;}await save({...state,[field]:amount});}
    if(b.dataset.action==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const anchor=document.createElement('a');anchor.href=url;anchor.download=`mono-money-${today()}.json`;anchor.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
    if(b.dataset.action==='import')$('#import-file').click();
    if(b.dataset.action==='logout'){ await window.budgetCloud.logout();account=null;state=defaults();$('#login').hidden=false; }
  });
  $('#entry-form').addEventListener('submit',async e=>{e.preventDefault();const form=new FormData(e.target);const amount=number(form.get('amount'));if(amount===null||amount<=0){$('#entry-error').textContent='Введи сумму больше нуля, например 500 или 500,50.';return;}
    const date=String(form.get('date'));const cat=String(form.get('category'));if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!state.categories.some(c=>c.id===cat&&c.kind===entryKind)){toast('Проверь дату и категорию.',true);return;}
    const entry={id:crypto.randomUUID(),amount,kind:entryKind,category:cat,date,note:String(form.get('note')||'').trim()};if(await save({...state,entries:[...state.entries,entry]})){$('#entry-dialog').close();toast('Операция сохранена');}
  });
  $('#category-form').addEventListener('submit',async e=>{e.preventDefault();const form=new FormData(e.target);const name=String(form.get('name')||'').trim();if(!name)return;const item={id:crypto.randomUUID(),name,kind:String(form.get('kind')),icon:String(form.get('icon'))};if(await save({...state,categories:[...state.categories,item]})){$('#category-dialog').close();toast('Категория добавлена');}});
  $('#import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{const imported=JSON.parse(await file.text());if(!valid(imported))throw Error('invalid');if(!confirm('Заменить текущие данные записями из копии?'))return;if(await save(imported))toast('Копия восстановлена');}catch{toast('Не удалось прочитать файл с данными MONO / MONEY.',true);}});
  for(const dialog of document.querySelectorAll('dialog'))dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close();});
  $('#quick-add').addEventListener('click',openEntry);
  $('#login-form').addEventListener('submit',async e=>{
    e.preventDefault();
    const button=$('#password-login');
    const form=new FormData(e.currentTarget);
    button.disabled=true;
    $('#login-error').textContent='';
    try{
      await window.budgetCloud.login(String(form.get('email')).trim(),String(form.get('password')));
      account=await window.budgetCloud.session();
      if(!account)throw new Error('Не удалось открыть сеанс.');
      const loaded=await window.budgetCloud.load(account.id);
      if(loaded&&!valid(loaded))throw new Error('Данные имеют неизвестный формат. Ничего не изменено.');
      state=loaded||defaults();render();$('#login').hidden=true;
      e.currentTarget.querySelector('[name=password]').value='';
    }catch(error){$('#login-error').textContent=error.message||'Не удалось войти.';account=null;}
    finally{button.disabled=false;}
  });
  (async()=>{
    if(!window.budgetCloud?.ready){$('#password-login').disabled=true;$('#login-error').textContent='Вход ещё не настроен.';return;}
    try{
      account=await window.budgetCloud.session();
      if(!account)return;
      const loaded=await window.budgetCloud.load(account.id);
      if(loaded&&!valid(loaded))throw new Error('Данные имеют неизвестный формат. Ничего не изменено.');
      state=loaded||defaults();render();$('#login').hidden=true;
    }catch(error){$('#login-error').textContent=error.message||'Не удалось загрузить данные.';account=null;}
  })();
})();

  </script>
</body>
</html>
